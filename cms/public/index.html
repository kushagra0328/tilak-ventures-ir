<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tilak Ventures — Disclosure CMS</title><style>body{font-family:Arial,sans-serif;background:#f5f6f8;margin:0;color:#172033}.wrap{max-width:760px;margin:50px auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:28px;box-shadow:0 4px 20px #0000000b}h1{margin-top:0}.grid{display:grid;gap:14px}label{font-weight:600}input,select,button{width:100%;padding:12px;border:1px solid #ccd2dc;border-radius:8px;box-sizing:border-box;font-size:15px}button{background:#172033;color:#fff;border:0;cursor:pointer;font-weight:700}.hidden{display:none}.msg{margin-top:14px;padding:12px;border-radius:8px;background:#eef4ff}.note{font-size:13px;color:#657084}.logout{background:#fff;color:#172033;border:1px solid #ccd2dc}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card" id="login"><h1>Tilak Ventures</h1><p>Disclosure Management Portal</p><div class="grid"><label>CS Password</label><input id="pw" type="password" autocomplete="current-password"><button onclick="login()">Sign in</button><div id="lm" class="note"></div></div></div><div class="card hidden" id="app"><h1>Disclosure Upload</h1><p class="note">Upload the approved PDF. The portal places it in the correct repository folder and publishes it through the existing website workflow.</p><div class="grid"><label>Document type</label><select id="type" onchange="fields()"><option value="results">Financial Results</option><option value="annual-report">Annual Report</option><option value="corporate-announcements">Corporate Announcement</option><option value="shareholding-pattern">Shareholding Pattern</option><option value="corporate-governance">Corporate Governance</option><option value="investor-presentations">Investor Presentation</option><option value="notices-outcomes">Notices / Outcomes</option><option value="policies">Policies</option></select><div id="fybox"><label>Financial Year</label><select id="fy"></select></div><div id="qbox"><label>Quarter</label><select id="quarter"><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option></select></div><div id="titlebox" class="hidden"><label>Document title</label><input id="title" placeholder="e.g. AGM Notice 2026"></div><label>PDF</label><input id="file" type="file" accept="application/pdf"><button onclick="upload()">Publish</button><button class="logout" onclick="logout()">Sign out</button><div id="msg"></div></div></div></div><script>const $=id=>document.getElementById(id);for(let y=2026;y>=2013;y--){let o=document.createElement('option');o.value=`${y}-${String(y+1).slice(-2)}`;o.textContent=`FY ${y}-${String(y+1).slice(-2)}`;$('fy').append(o)}function fields(){let t=$('type').value,r=t==='results',a=t==='annual-report';$('qbox').classList.toggle('hidden',!r);$('fybox').classList.toggle('hidden',!r&&!a);$('titlebox').classList.toggle('hidden',r||a)}async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('pw').value})});let x=await r.json();if(r.ok){$('login').classList.add('hidden');$('app').classList.remove('hidden')}else $('lm').textContent=x.error||'Sign in failed'}async function upload(){let f=$('file').files[0];if(!f)return $('msg').textContent='Please select a PDF.';let fd=new FormData();fd.append('type',$('type').value);fd.append('fy',$('fy').value);fd.append('quarter',$('quarter').value);fd.append('title',$('title').value);fd.append('file',f);$('msg').textContent='Publishing…';let r=await fetch('/api/upload',{method:'POST',body:fd});let x=await r.json();$('msg').textContent=r.ok?`Published: ${x.path}`:(x.error||'Upload failed');if(r.ok)$('file').value=''}async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}fields()</script></body></html>
