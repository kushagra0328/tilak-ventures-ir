<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investor Centre | Tilak Ventures Limited</title><meta http-equiv="cache-control" content="no-cache"><script>
(async()=>{
 const source='https://raw.githubusercontent.com/kushagra0328/tilak-ventures-ir/4047bb83240b91dae3662bb87b653974acdac962/investors.html';
 const r=await fetch(source,{cache:'no-store'}); if(!r.ok) throw new Error('Investor Centre source unavailable');
 const html=await r.text(); const doc=new DOMParser().parseFromString(html,'text/html');
 document.documentElement.innerHTML=doc.documentElement.innerHTML;
 for(const old of [...document.querySelectorAll('script')]){const s=document.createElement('script'); if(old.src)s.src=old.src; else s.textContent=old.textContent; old.replaceWith(s);}
 const patch=document.createElement('script'); patch.textContent=`
 (()=>{
  const complaintView=document.createElement('div'); complaintView.id='complaintsPatchView'; complaintView.className='results-wrap'; complaintView.hidden=true;
  const list=document.getElementById('feedList'); if(!list)return;
  list.parentNode.insertBefore(complaintView,list);
  const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
  const url=v=>{try{const u=new URL(v,location.href);return /^https?:$/.test(u.protocol)?u.href:'#'}catch{return '#'}};
  const dt=v=>{if(!v)return '—';const d=new Date(String(v).replace('T',' '));if(Number.isNaN(d.getTime()))return esc(v);return new Intl.DateTimeFormat('en-IN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Kolkata'}).format(d)};
  const xbrl=i=>i?.xbrl|| (i?.newsId?`https://www.bseindia.com/Msource/90D/CorpXbrlGen.aspx?Bsenewid=${encodeURIComponent(i.newsId)}&Scripcode=${encodeURIComponent(i.scripCode||'503663')}`:'');
  const q=i=>{const s=String(i?.quarter||'')+' '+String(i?.title||'');const m=s.match(/\\b(January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[\\s,.-]+(20\\d{2})\\b/i);if(!m)return String(i?.quarter||'—');const a={jan:'Jan',january:'Jan',feb:'Feb',february:'Feb',mar:'Mar',march:'Mar',apr:'Apr',april:'Apr',may:'May',jun:'Jun',june:'Jun',jul:'Jul',july:'Jul',aug:'Aug',august:'Aug',sep:'Sep',sept:'Sep',september:'Sep',oct:'Oct',october:'Oct',nov:'Nov',november:'Nov',dec:'Dec',december:'Dec'};return a[m[1].toLowerCase()]+' '+m[2]};
  const fy=(z,i)=>{const m=String(z).match(/^(Jan|Feb|Mar)\\s+(20\\d{2})$/i);if(m)return `${Number(m[2])-1} - ${m[2]}`;const y=String(z).match(/20\\d{2}/);if(y){const n=Number(y[0]);return `${n} - ${n+1}`};const d=new Date(String(i?.date||'').replace('T',' '));if(!Number.isNaN(d.getTime())){const n=d.getMonth()<3?d.getFullYear()-1:d.getFullYear();return `${n} - ${n+1}`};return '—'};
  window.renderComplaintsBse=(items)=>{complaintView.hidden=false;list.hidden=true;const rows=[...(items||[])].sort((a,b)=>(new Date(b.date)-new Date(a.date)));complaintView.innerHTML=`<div style="padding:18px 20px 14px;background:#fff;border-bottom:1px solid var(--line);font-size:12px;color:#30353a;line-height:1.6">To view Integrated Filing (Governance) from March 2025 quarter, please <a href="https://www.bseindia.com/stock-share-price/tilak-ventures-ltd/tilakventures/503663/corp-gov/" target="_blank" rel="noopener noreferrer" style="color:#0969e8;text-decoration:none;font-weight:600">click here</a>.</div><div style="overflow-x:auto"><table class="governance-table"><thead><tr><th>Year</th><th>Quarter</th><th>Status</th><th>Filing Date Time</th><th>Revised Filing Date Time</th><th>Revision Reason</th><th>XBRL Link</th></tr></thead><tbody>${rows.map(i=>{const z=q(i),x=xbrl(i);return `<tr><td>${esc(fy(z,i))}</td><td>${i.pdf?`<a class="governance-quarter-link" href="${esc(url(i.pdf))}" target="_blank" rel="noopener noreferrer">${esc(z)}</a>`:esc(z)}</td><td>${esc(i.status||'New')}</td><td>${dt(i.date)}</td><td>${dt(i.revisedDate)}</td><td>${esc(i.revisionReason||'—')}</td><td>${x?`<a class="xbrl-link" href="${esc(url(x))}" target="_blank" rel="noopener noreferrer">XBRL</a>`:'—'}</td></tr>`}).join('')}</tbody></table></div><div style="padding:14px 20px;border-top:1px solid var(--line);background:#fafbfc;font-size:10px;color:var(--muted)">Statement of Investor Complaints filings are sourced from BSE for scrip 503663 and follow the BSE filing-table format.</div>`};
  const complaintButton=[...document.querySelectorAll('.investor-sidebar button')].find(b=>b.dataset.category==='Investor Complaints'); if(!complaintButton)return;
  complaintButton.addEventListener('click',async()=>{setTimeout(async()=>{try{const p=new URLSearchParams({page:'1',category:'Investor Complaints'});const r=await fetch('/api/investor-feed?'+p,{cache:'no-store'});const d=await r.json();if(r.ok)window.renderComplaintsBse(d.items||[]);}catch(e){console.error(e)}},75)},{capture:true});
 })();`;
 document.body.appendChild(patch);
})().catch(e=>{document.body.innerHTML='<p style="font-family:Arial;padding:40px">Investor Centre temporarily unavailable. Please refresh.</p>';});
</script></head><body></body></html>
