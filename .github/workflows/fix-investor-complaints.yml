name: Fix Investor Complaints BSE Layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install final BSE investor complaints renderer
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('investors.html')
          s = p.read_text(encoding='utf-8')

          # Remove all earlier attempts so only the final renderer controls this section.
          s = re.sub(r'\s*<script[^>]+investor-complaints-bse\.js[^>]*></script>\s*', '\n', s)

          # Load the final renderer after the page's existing inline code. It uses
          # capture-phase event handling and therefore prevents the old complaint
          # card renderer from replacing the BSE-style table.
          tag = '<script src="investor-complaints-bse.js?v=20260812-final"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')

          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investors.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load final BSE investor complaints renderer'
          git push
