name: Fix Investor Complaints BSE Layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch investors.html with latest renderer
        shell: python
        run: |
          from pathlib import Path
          p = Path('investors.html')
          s = p.read_text(encoding='utf-8')
          import re
          s = re.sub(r'<script src="/investor-complaints-bse\.js\?v=[^"]+"></script>\s*', '', s)
          marker = '<script src="/investor-complaints-bse.js?v=20260812-3"></script>'
          if marker not in s:
              s = s.replace('</body>', marker + '\n</body>')
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investors.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load latest investor complaints BSE renderer'
          git push
