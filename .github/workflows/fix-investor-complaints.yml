name: Fix Investor Complaints BSE Layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Investor Centre with inline BSE complaints table
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('investors.html')
          s = p.read_text(encoding='utf-8')

          # Remove the old external renderer. The complaints renderer is kept inline
          # so it cannot lose a race with the main Investor Centre loader or a stale JS asset.
          s = re.sub(r'\s*<script src="/investor-complaints-bse\\.js\\?v=[^"]+"></script>\s*', '\n', s)

          old = "const isResults=state.category==='Financial Results',isAnnual=state.category==='Annual Reports',isVoting=state.category==='Shareholders Meetings'&&state.query==='voting',isShareholding=state.category==='Shareholding Pattern',isGovernance=state.category==='Corporate Governance',isRelatedParty=state.category==='Related Party Transactions';"
          new = "const isResults=state.category==='Financial Results',isAnnual=state.category==='Annual Reports',isVoting=state.category==='Shareholders Meetings'&&state.query==='voting',isShareholding=state.category==='Shareholding Pattern',isGovernance=state.category==='Corporate Governance',isRelatedParty=state.category==='Related Party Transactions',isComplaints=state.category==='Investor Complaints';"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Could not find Investor Centre category declaration')

          old = "list.hidden=isResults||isAnnual||isVoting||isShareholding||isGovernance||isRelatedParty;controls.hidden=isResults||isAnnual||isVoting||isShareholding||isGovernance||isRelatedParty;title.textContent=isResults?'Results':isAnnual?'Annual Reports':isVoting?'Voting Results':isShareholding?'Shareholding Pattern':isGovernance?'Corporate Governance':isRelatedParty?'Related Party Transactions':(buttons.find(b=>b.classList.contains('active'))?.textContent.trim()||'Investor Filings');"
          new = "list.hidden=isResults||isAnnual||isVoting||isShareholding||isGovernance||isRelatedParty||isComplaints;controls.hidden=isResults||isAnnual||isVoting||isShareholding||isGovernance||isRelatedParty||isComplaints;title.textContent=isResults?'Results':isAnnual?'Annual Reports':isVoting?'Voting Results':isShareholding?'Shareholding Pattern':isGovernance?'Corporate Governance':isRelatedParty?'Related Party Transactions':isComplaints?'Statement of Investor Complaints':(buttons.find(b=>b.classList.contains('active'))?.textContent.trim()||'Investor Filings');"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Could not find Investor Centre view declaration')

          marker = "if(isRelatedParty)relatedPartyView.innerHTML='<div class=\"feed-empty\">Loading BSE related-party transaction filings…</div>';"
          replacement = marker + "if(isComplaints)list.innerHTML='<div class=\"feed-empty\">Loading BSE investor-complaint filings…</div>';"
          if replacement not in s:
              if marker not in s:
                  raise SystemExit('Could not find related-party loading marker')
              s = s.replace(marker, replacement, 1)

          fn = r'''function renderInvestorComplaints(items){
            const rows=[...(items||[])].sort((a,b)=>(parseDate(b.date)?.getTime()||0)-(parseDate(a.date)?.getTime()||0));
            const complaintRows=rows.filter(item=>/investor complaint|investor grievance|complaints/i.test(String(item.title||''))||item.category==='Investor Complaints');
            const data=complaintRows.length?complaintRows:rows;
            if(!data.length){list.innerHTML='<div class="feed-empty">No investor-complaint filings were returned by BSE.</div>';return;}
            list.className='feed-list results-wrap';
            const xbrlFor=item=>{const x=item?.xbrl||((item?.newsId)?`https://www.bseindia.com/Msource/90D/CorpXbrlGen.aspx?Bsenewid=${encodeURIComponent(item.newsId)}&Scripcode=${encodeURIComponent(item.scripCode||'503663')}`:'');return x?safeUrl(x):'#';};
            const quarterFor=item=>{const source=`${item?.quarter||''} ${item?.title||''}`;const m=source.match(/\\b(January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[\\s,.-]+(20\\d{2})\\b/i);if(m){const map={jan:'Jan',january:'Jan',feb:'Feb',february:'Feb',mar:'Mar',march:'Mar',apr:'Apr',april:'Apr',may:'May',jun:'Jun',june:'Jun',jul:'Jul',july:'Jul',aug:'Aug',august:'Aug',sep:'Sep',sept:'Sep',september:'Sep',oct:'Oct',october:'Oct',nov:'Nov',november:'Nov',dec:'Dec',december:'Dec'};return `${map[m[1].toLowerCase()]||m[1]} ${m[2]}`;}return String(item?.quarter||'—').replace(/^Q[1-4]$/i,'—');};
            const yearFor=q=>{const m=String(q).match(/^(Jan|Feb|Mar)\\s+(20\\d{2})$/i);if(m)return `${Number(m[2])-1} - ${m[2]}`;const y=String(q).match(/20\\d{2}/);if(y){const n=Number(y[0]);return `${n-1} - ${n}`;}return '—';};
            const rowsHtml=data.map(item=>{const q=quarterFor(item),x=xbrlFor(item),qCell=item?.pdf?`<a class="governance-quarter-link" href="${esc(safeUrl(item.pdf))}" target="_blank" rel="noopener noreferrer">${esc(q)}</a>`:`<span>${esc(q)}</span>`,xb=x&&x!=='#'?`<a class="xbrl-link" href="${esc(x)}" target="_blank" rel="noopener noreferrer">XBRL</a>`:'<span class="result-empty">—</span>';return `<tr><td>${esc(yearFor(q))}</td><td>${qCell}</td><td>${esc(item?.status||'New')}</td><td>${formatDate(item?.date)}</td><td>${formatDate(item?.revisedDate)}</td><td>${esc(item?.revisionReason||'—')}</td><td>${xb}</td></tr>`;}).join('');
            list.innerHTML=`<div class="governance-note">To view Integrated Filing (Governance) from March 2025 quarter, please <a href="https://www.bseindia.com/stock-share-price/tilak-ventures-ltd/tilakventures/503663/corp-gov/" target="_blank" rel="noopener noreferrer">click here</a>.</div><div class="results-wrap"><table class="governance-table"><thead><tr><th>Year</th><th>Quarter</th><th>Status</th><th>Filing Date Time</th><th>Revised Filing Date Time</th><th>Revision Reason</th><th>XBRL Link</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
          }
          '''
          if 'function renderInvestorComplaints(items)' not in s:
              anchor = 'function renderList(items)'
              if anchor not in s:
                  raise SystemExit('Could not find renderList anchor')
              s = s.replace(anchor, fn + anchor, 1)

          old = "else if(isRelatedParty)renderRelatedParty(data.items||[]);else renderList(data.items||[]);"
          new = "else if(isRelatedParty)renderRelatedParty(data.items||[]);else if(isComplaints)renderInvestorComplaints(data.items||[]);else renderList(data.items||[]);"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Could not patch complaints render dispatch')

          old = "if(!isResults&&!isAnnual&&!isVoting&&!isShareholding&&!isGovernance&&!isRelatedParty){const total=Number(data.total||0),pageSize=20,pages=Math.max(1,Math.ceil(total/pageSize));"
          new = "if(!isResults&&!isAnnual&&!isVoting&&!isShareholding&&!isGovernance&&!isRelatedParty&&!isComplaints){const total=Number(data.total||0),pageSize=20,pages=Math.max(1,Math.ceil(total/pageSize));"
          if old in s:
              s = s.replace(old, new, 1)

          old = "else if(isRelatedParty)relatedPartyView.innerHTML=message;else list.innerHTML=message;"
          new = "else if(isRelatedParty)relatedPartyView.innerHTML=message;else if(isComplaints)list.innerHTML=message;else list.innerHTML=message;"
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investors.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inline BSE investor complaints table renderer'
          git push
