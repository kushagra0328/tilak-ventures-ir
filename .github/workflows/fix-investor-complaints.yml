name: Fix Investor Complaints BSE Layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize inline BSE investor complaints renderer
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('investors.html')
          s = p.read_text(encoding='utf-8')

          # There must be only one renderer: the inline renderer in investors.html.
          s = re.sub(r'\s*<script src="/investor-complaints-bse\.js\?v=[^"]+"></script>\s*', '\n', s)

          # The first inline patch was generated through a YAML/Python layer and
          # therefore contained double-escaped regex tokens. Normalize only that
          # renderer so quarter/year extraction works correctly in the browser.
          start = s.find('function renderInvestorComplaints(items){')
          end = s.find('function renderList(items)', start)
          if start != -1 and end != -1:
              chunk = s[start:end]
              chunk = chunk.replace(r'\\b', r'\b').replace(r'\\s', r'\s').replace(r'\\d', r'\d')
              s = s[:start] + chunk + s[end:]

          # Investor Complaints uses the BSE table container, not the generic feed list state.
          s = s.replace(
              "list.hidden=isResults||isAnnual||isVoting||isShareholding||isGovernance||isRelatedParty||isComplaints;",
              "list.hidden=isResults||isAnnual||isVoting||isShareholding||isGovernance||isRelatedParty;"
          )
          s = s.replace(
              "if(!isResults&&!isAnnual&&!isVoting&&!isShareholding&&!isGovernance&&!isRelatedParty)list.innerHTML='<div class=\"feed-empty\">Loading exchange filings…</div>';",
              "if(!isResults&&!isAnnual&&!isVoting&&!isShareholding&&!isGovernance&&!isRelatedParty&&!isComplaints)list.innerHTML='<div class=\"feed-empty\">Loading exchange filings…</div>';"
          )

          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investors.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize BSE investor complaints renderer'
          git push
