name: Fix Investor Complaints BSE Layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Investor Centre with inline BSE complaints table
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('investors.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\s*<script src="/investor-complaints-bse\\.js\\?v=[^"]+"></script>\s*', '\n', s)

          # Keep the complaints section on the same table container used by BSE.
          s = s.replace(
              "list.hidden=isResults||isAnnual||isVoting||isShareholding||isGovernance||isRelatedParty||isComplaints;",
              "list.hidden=isResults||isAnnual||isVoting||isShareholding||isGovernance||isRelatedParty;",
              1
          )
          s = s.replace(
              "if(!isResults&&!isAnnual&&!isVoting&&!isShareholding&&!isGovernance&&!isRelatedParty)list.innerHTML='<div class=\"feed-empty\">Loading exchange filings…</div>';",
              "if(!isResults&&!isAnnual&&!isVoting&&!isShareholding&&!isGovernance&&!isRelatedParty&&!isComplaints)list.innerHTML='<div class=\"feed-empty\">Loading exchange filings…</div>';",
              1
          )
          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investors.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix investor complaints table visibility'
          git push
