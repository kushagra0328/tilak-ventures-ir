name: Fix Investor Complaints BSE Layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch BSE investor feed and responsive layouts
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Investor Complaints must query the Investor Complaints category.
          p = Path('investor-complaints-bse.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"var CATEGORY='[^']*';", "var CATEGORY='Investor Complaints';", s, count=1)

          # BSE's API normally supplies the quarter. For older rows where the
          # quarter field is absent, infer the reporting quarter from the filing
          # date so the row still renders instead of disappearing.
          old_q = "return String((item&&item.quarter)||'—');"
          new_q = "var raw=String((item&&item.quarter)||'').trim();if(raw)return raw;var d=parsed(item&&item.date);if(d){var m=d.getMonth()+1,y=d.getFullYear();if(m<=3)return 'Dec '+(y-1);if(m<=6)return 'Mar '+y;if(m<=9)return 'Jun '+y;return 'Sep '+y;}return '—';"
          if old_q in s:
              s = s.replace(old_q, new_q, 1)

          s = s.replace('No corporate-governance filings were returned by BSE.', 'No investor-complaint filings were returned by BSE.')
          s = s.replace('To view Integrated Filing (Governance) from March 2025 quarter, please', 'To view Integrated Filing (Governance) from March 2025 quarter, please')
          p.write_text(s, encoding='utf-8')

          # 2) Ensure the API classification and category filter remain title-aware.
          p = Path('functions/api/investor-feed.js')
          s = p.read_text(encoding='utf-8')
          marker = "const category=String(pick(row,['CATEGORYNAME','CATEGORY_NAME','CategoryName'])).toLowerCase();const t=String(title||'').toLowerCase();"
          if marker in s and "statement of investor complaints|complaints for the quarter" not in s.split(marker,1)[1][:220]:
              s = s.replace(marker, marker + "if(/investor complaint|investor grievance|statement of investor complaints|complaints for the quarter/i.test(t))return 'Investor Complaints';", 1)
          old = "const filtered=category==='Financial Results'?unique.filter(item=>item.category==='Financial Results'&&(!query||item.title.toLowerCase().includes(query))):unique.filter(item=>(!category||item.category===category)&&(!query||item.title.toLowerCase().includes(query)));"
          new = "const filtered=category==='Financial Results'?unique.filter(item=>item.category==='Financial Results'&&(!query||item.title.toLowerCase().includes(query))):category==='Investor Complaints'?unique.filter(item=>(item.category==='Investor Complaints'||/investor complaint|investor grievance|statement of investor complaints|complaints for the quarter/i.test(String(item.title||'')))&&(!query||String(item.title||'').toLowerCase().includes(query))):unique.filter(item=>(!category||item.category===category)&&(!query||item.title.toLowerCase().includes(query)));"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Load responsive navigation on every public page that uses the main header.
          tag = '<script src="mobile-nav.js?v=20260812-responsive2"></script>'
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<script src="mobile-nav\.js\?v=[^"]+"></script>\s*', '', s)
              if '<header class="top">' not in s:
                  continue
              s = s.replace('</body>', tag + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')

          # 4) Keep the Investor Centre redirect cache-busted to the responsive page.
          p = Path('investor-centre.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'investors\.html\?v=[^\']+', 'investors.html?v=20260812-responsive2', s)
          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investor-complaints-bse.js functions/api/investor-feed.js mobile-nav.js investor-centre.html *.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix complaint quarter fallback and mobile responsive navigation'
          git push
