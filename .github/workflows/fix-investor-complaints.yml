name: Fix Investor Complaints BSE Layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale external complaints renderer
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('investors.html')
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(r'\s*<script src="/investor-complaints-bse\.js\?v=[^"]+"></script>\s*', '\n', s)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investors.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove stale investor complaints renderer'
          git push
