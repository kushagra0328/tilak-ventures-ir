name: Fix Investor Complaints BSE Layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch BSE investor feed and renderer
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Fix the BSE feed classification. BSE can label historical
          # complaint filings under a broad Corporate Governance category;
          # the filing title is the authoritative discriminator for this page.
          p = Path('functions/api/investor-feed.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              "function classify(row,title){const category=String(pick(row,['CATEGORYNAME','CATEGORY_NAME','CategoryName'])).toLowerCase();const t=String(title||'').toLowerCase();",
              "function classify(row,title){const category=String(pick(row,['CATEGORYNAME','CATEGORY_NAME','CategoryName'])).toLowerCase();const t=String(title||'').toLowerCase();if(/investor complaint|investor grievance|statement of investor complaints|complaints for the quarter/i.test(t))return 'Investor Complaints';"
          )

          # 2) Make the API category filter title-aware so complaint filings
          # cannot disappear merely because BSE's broad category is Governance.
          old = "const filtered=category==='Financial Results'?unique.filter(item=>item.category==='Financial Results'&&(!query||item.title.toLowerCase().includes(query))):unique.filter(item=>(!category||item.category===category)&&(!query||item.title.toLowerCase().includes(query)));"
          new = "const filtered=category==='Financial Results'?unique.filter(item=>item.category==='Financial Results'&&(!query||item.title.toLowerCase().includes(query))):category==='Investor Complaints'?unique.filter(item=>(item.category==='Investor Complaints'||/investor complaint|investor grievance|statement of investor complaints|complaints for the quarter/i.test(String(item.title||'')))&&(!query||String(item.title||'').toLowerCase().includes(query))):unique.filter(item=>(!category||item.category===category)&&(!query||item.title.toLowerCase().includes(query)));"
          if old not in s:
              raise SystemExit('Expected investor-feed filter was not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # 3) Keep the BSE-style renderer loaded exactly once.
          p = Path('investors.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\s*<script[^>]+investor-complaints-bse\.js[^>]*></script>\s*', '\n', s)
          tag = '<script src="investor-complaints-bse.js?v=20260812-datafix"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/investor-feed.js investors.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix BSE investor complaints data filtering'
          git push
