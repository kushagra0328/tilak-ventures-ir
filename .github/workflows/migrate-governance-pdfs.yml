name: Finalize Governance Policy Migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Migrate governance PDFs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download legacy governance PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p governance-policies
          python3 - <<'PY'
          import html, re, urllib.parse, urllib.request
          from pathlib import Path
          pages = [
              'https://tilakfinance.wordpress.com/policies-2/',
              'https://tilakfinance.wordpress.com/2015/06/whistle-blower-policy/',
          ]
          direct = [
              'https://tilakfinance.files.wordpress.com/2015/06/whistle_blower_policy_tilak.pdf',
              'https://tilakfinance.files.wordpress.com/2016/04/policy-on-material-subsidaries_tilak.pdf',
              'https://tilakfinance.files.wordpress.com/2015/07/rpt_tilak.pdf',
              'https://tilakfinance.files.wordpress.com/2016/04/terms-and-conditions-of-independent-director.pdf',
              'https://tilakfinance.files.wordpress.com/2016/04/remuneration-policy_tilak.pdf',
              'https://tilakfinance.files.wordpress.com/2016/07/policy-of-insider-trading.pdf',
              'https://tilakfinance.files.wordpress.com/2016/04/familarisation-programme-for-id_tilak.pdf',
              'https://tilakfinance.wordpress.com/wp-content/uploads/2018/07/tilak_17-18.pdf',
          ]
          urls = set(direct)
          for page in pages:
              try:
                  req=urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0'})
                  body=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
                  for href in re.findall(r'href=[\"\']([^\"\']+\.pdf(?:\?[^\"\']*)?)[\"\']',body,re.I):
                      urls.add(urllib.parse.urljoin(page,html.unescape(href)))
              except Exception as e:
                  print('Page fetch warning:', page, e)
          for url in sorted(urls):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=60).read()
                  if not data.startswith(b'%PDF'):
                      continue
                  name=Path(urllib.parse.unquote(urllib.parse.urlparse(url).path)).name
                  if name.lower().endswith('.pdf'):
                      (Path('governance-policies')/name).write_bytes(data)
              except Exception as e:
                  print('Download warning:',url,e)
          PY

      - name: Replace Governance links with repository-hosted PDFs
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('governance.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
            'https://tilakfinance.files.wordpress.com/2015/06/whistle_blower_policy_tilak.pdf': 'governance-policies/whistle-blower-policy_tilak-07-04-2018.pdf',
            'https://tilakfinance.files.wordpress.com/2016/04/policy-on-material-subsidaries_tilak.pdf': 'governance-policies/policy-on-material-subsidaries_tilak.pdf',
            'https://tilakfinance.files.wordpress.com/2015/07/rpt_tilak.pdf': 'governance-policies/rpt_tilak-07-04-2018.pdf',
            'https://tilakfinance.files.wordpress.com/2016/04/terms-and-conditions-of-independent-director.pdf': 'governance-policies/terms-and-conditions-of-independent-director.pdf',
            'https://tilakfinance.files.wordpress.com/2016/04/remuneration-policy_tilak.pdf': 'governance-policies/remuneration-policy-tilak-07-04-2018.pdf',
            'https://tilakfinance.files.wordpress.com/2016/07/policy-of-insider-trading.pdf': 'governance-policies/policy-of-insider-trading.pdf',
            'https://tilakfinance.files.wordpress.com/2016/04/familarisation-programme-for-id_tilak.pdf': 'governance-policies/familiarisaton-programme-2017-18.pdf',
            'https://tilakfinance.wordpress.com/wp-content/uploads/2018/07/tilak_17-18.pdf': 'governance-policies/tilak_17-18.pdf',
          }
          for old,new in replacements.items():
              text = text.replace(old,new)

          archive = 'https://tilakfinance.wordpress.com/policies-2/'
          policy_map = {
            'CSR Policy': 'governance-policies/tilak-csr-policy.pdf',
            'Risk Management Policy': 'governance-policies/risk-mgt-policy_tilak-07-04-18.pdf',
            'Sexual Harassment Policy': 'governance-policies/sexual-harassment-policy-07-04-2018.pdf',
            'Policy on Determining Materiality of Events': 'governance-policies/policy-on-material-event_tilak.pdf',
            'Code of Conduct': 'governance-policies/code-of-conduct-07-04-2018.pdf',
          }
          for label, target in policy_map.items():
              pattern = re.compile(r'<a class="archive-link" href="' + re.escape(archive) + r'"[^>]*>' + re.escape(label) + r'<small>.*?</small></a>', re.S)
              replacement = f'<a href="{target}" target="_blank" rel="noopener">{label}<small>Direct PDF · Company-hosted</small></a>'
              text,n = pattern.subn(replacement,text,count=1)
              if n != 1:
                  raise SystemExit(f'Could not replace Governance policy link: {label}')

          # Add all seven historical familiarisation-programme PDFs supplied for migration.
          anchor = '<a href="governance-policies/tilak_17-18.pdf" target="_blank" rel="noopener">Familiarization Programme · FY 2017-18<small>Direct PDF · Historical disclosure</small></a>'
          familiarisation = [
            ('FY 2016-17','governance-policies/tilak_16-17.pdf'),
            ('FY 2017-18','governance-policies/tilak_17-18.pdf'),
            ('FY 2018-19','governance-policies/tilak_18-19-1.pdf'),
            ('FY 2020-21','governance-policies/20-21-tilak.pdf'),
            ('FY 2021-22','governance-policies/21-22-tilak.pdf'),
            ('FY 2022-23','governance-policies/22-23-tilak.pdf'),
            ('FY 2017-18 · Programme disclosure','governance-policies/familiarisaton-programme-2017-18.pdf'),
          ]
          if anchor not in text:
              raise SystemExit('Familiarisation anchor not found')
          links = ''.join(f'<a href="{href}" target="_blank" rel="noopener">Familiarization Programme · {label}<small>Direct PDF · Company-hosted</small></a>' for label,href in familiarisation)
          text = text.replace(anchor, links)

          text = text.replace(
            'Governance policies are linked to the Company’s historical document archive. Direct PDF paths are used where they are independently verifiable; items for which the legacy archive does not expose a reliably verifiable PDF URL are routed to the Company’s Policies archive rather than to the WordPress homepage or an unverified file.',
            'Governance policies and historical governance documents are hosted directly by the Company website repository. These links are independent of the legacy WordPress website and will continue to work after the WordPress site is disabled.'
          )
          old_note = re.compile(r'<div class="policy-note">.*?</div>', re.S)
          text,n = old_note.subn('<div class="policy-note"><b>Document hosting:</b> Governance policy PDFs are hosted directly in the Company website repository. No Governance policy link depends on the legacy WordPress website.</div>', text, count=1)
          if n != 1:
              raise SystemExit('Governance policy note not found')

          if 'tilakfinance.wordpress.com' in text or 'tilakfinance.files.wordpress.com' in text:
              raise SystemExit('WordPress dependency remains in governance.html')
          path.write_text(text,encoding='utf-8')
          print('Governance policy links migrated successfully.')

      - name: Remove migration workflow and commit final migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/migrate-governance-pdfs.yml
          git add governance.html governance-policies
          git commit -m 'Migrate governance PDFs'
          git push
