name: Repair BSE investor feed

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch BSE feed and remove repair workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('functions/api/investor-feed.js')
          s = p.read_text()
          old = "const BSE_API = 'https://api.bseindia.com/BseIndiaAPI/api/AnnGetData/w';"
          new = "const BSE_API = 'https://api.bseindia.com/BseIndiaAPI/api/AnnSubCategoryGetData/w';\nconst BSE_API_FALLBACK = 'https://api.bseindia.com/BseIndiaAPI/api/AnnGetData/w';"
          if old in s:
              s = s.replace(old, new, 1)
          old_fn = '''async function fetchPage(page,from,to){const params=new URLSearchParams({pageno:String(page),strCat:'-1',strPrevDate:from,strScrip:BSE_SCRIP_CODE,strSearch:'P',strToDate:to,strType:'C'});const response=await fetch(`${BSE_API}?${params.toString()}`,{headers:{Accept:'application/json, text/plain, */*',Origin:'https://www.bseindia.com',Referer:'https://www.bseindia.com/','User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'},cf:{cacheTtl:300,cacheEverything:true}});if(!response.ok)throw new Error(`BSE responded with ${response.status}`);return response.json();}'''
          new_fn = '''async function fetchPage(page,from,to){const headers={Accept:'application/json, text/plain, */*',Origin:'https://www.bseindia.com',Referer:'https://www.bseindia.com/corporates/ann.html','User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Cache-Control':'no-cache'};const params=new URLSearchParams({pageno:String(page),strType:'C',strSearch:'P',strScrip:BSE_SCRIP_CODE,strPrevDate:from,strToDate:to,strCat:'-1',subcategory:''});let response=await fetch(`${BSE_API}?${params.toString()}`,{headers,cf:{cacheTtl:300,cacheEverything:true}});if(!response.ok){response=await fetch(`${BSE_API_FALLBACK}?${params.toString()}`,{headers,cf:{cacheTtl:300,cacheEverything:true}});}if(!response.ok)throw new Error(`BSE responded with ${response.status}`);const data=await response.json();if(!Array.isArray(data?.Table))throw new Error('BSE returned an unexpected investor-feed response');return data;}'''
          if old_fn not in s:
              raise SystemExit('Expected fetchPage function was not found; aborting without changes')
          s = s.replace(old_fn, new_fn, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/repair-bse-feed.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/investor-feed.js .github/workflows/repair-bse-feed.yml
          git commit -m 'Fix BSE investor feed endpoint' || exit 0
          git push