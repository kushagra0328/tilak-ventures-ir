name: Fix Results Q1 BSE coverage

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!startsWith(github.event.head_commit.message, '[auto-results-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Results feed to search all BSE filings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('functions/api/investor-feed.js')
          s = p.read_text()
          old = "const params = new URLSearchParams({ pageno: String(page), strCat: isResults ? 'Result' : '-1', strPrevDate: from, strScrip: '503663', strSearch: 'P', strToDate: to, strType: 'C', subcategory: isResults ? 'Financial Results' : '' });"
          new = "const params = new URLSearchParams({ pageno: String(page), strCat: '-1', strPrevDate: from, strScrip: '503663', strSearch: 'P', strToDate: to, strType: 'C', subcategory: '' });"
          if old not in s:
              raise SystemExit('fetchPage target not found')
          s = s.replace(old, new, 1)
          old2 = "const filtered = category === 'Financial Results' ? unique.filter(item => (!query || item.title.toLowerCase().includes(query))) : unique.filter(item => (!category || item.category === category) && (!query || item.title.toLowerCase().includes(query)));"
          new2 = "const filtered = category === 'Financial Results' ? unique.filter(item => item.category === 'Financial Results' && (!query || item.title.toLowerCase().includes(query))) : unique.filter(item => (!category || item.category === category) && (!query || item.title.toLowerCase().includes(query)));"
          if old2 not in s:
              raise SystemExit('filter target not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit Results fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/investor-feed.js
          git rm .github/workflows/fix-results-q1.yml
          git commit -m '[auto-results-fix] restore missing Q1 BSE result PDFs'
          git push
