name: Update Results Archive Layout

on:
  push:
    paths:
      - 'automation/results-layout.trigger'

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Results table
        run: python3 automation/update-results-layout.py

      - name: Commit Results layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investors.html
          git commit -m 'Make Results archive independent of BSE and use quarter placeholders' || exit 0
          git push
