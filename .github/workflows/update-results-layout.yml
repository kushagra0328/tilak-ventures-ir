name: Update Results Archive Layout

on:
  push:
    paths:
      - 'automation/results-layout.trigger'
      - 'automation/update-results-layout.py'
      - 'investor-results-manifest.json'

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build independent Results archive
        run: python3 automation/update-results-layout.py

      - name: Commit Results archive and layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investors.html investor-manual-results.json results/
          git commit -m 'Archive historical financial results locally' || exit 0
          git push
