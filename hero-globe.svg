<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Hand holding a financial globe</title>
<desc id="desc">A premium navy and gold financial illustration of a hand holding a globe, designed for Tilak Ventures Limited.</desc>
<defs>
  <radialGradient id="bg" cx="70%" cy="38%" r="75%"><stop offset="0" stop-color="#eaf1f6"/><stop offset=".52" stop-color="#d9e3ea"/><stop offset="1" stop-color="#b8c6d0"/></radialGradient>
  <radialGradient id="globe" cx="34%" cy="25%" r="72%"><stop offset="0" stop-color="#f7fafc"/><stop offset=".18" stop-color="#dce6ee"/><stop offset=".52" stop-color="#8193a2"/><stop offset=".82" stop-color="#354858"/><stop offset="1" stop-color="#142635"/></radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset=".45" stop-color="#aebdc8"/><stop offset="1" stop-color="#465968"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7c0a0"/><stop offset=".55" stop-color="#bd8d6c"/><stop offset="1" stop-color="#765440"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="sphere"><circle cx="850" cy="390" r="270"/></clipPath>
</defs>
<rect width="1400" height="1000" fill="url(#bg)"/>
<ellipse cx="920" cy="770" rx="450" ry="90" fill="#122333" opacity=".18" filter="url(#shadow)"/>
<!-- globe -->
<circle cx="850" cy="390" r="270" fill="url(#globe)"/>
<g clip-path="url(#sphere)" fill="none" stroke="#f5f8fa" opacity=".34">
  <ellipse cx="850" cy="390" rx="220" ry="270" stroke-width="2"/>
  <ellipse cx="850" cy="390" rx="105" ry="270" stroke-width="2"/>
  <ellipse cx="850" cy="390" rx="270" ry="92" stroke-width="2"/>
  <ellipse cx="850" cy="390" rx="270" ry="180" stroke-width="2"/>
  <path d="M580 390h540M610 275h480M610 505h480" stroke-width="1.5"/>
</g>
<!-- simplified continents -->
<g clip-path="url(#sphere)" fill="#203442" opacity=".92">
  <path d="M720 180c28-27 72-36 106-19l25 25-14 31-30 13-16 42-36 12-22-31-36-18 5-28z"/>
  <path d="M878 230l58-22 43 21 28 42-22 28-39-5-23 30-39-13-16-38z"/>
  <path d="M820 425l46-12 36 27-9 43-25 23-2 57-32 53-28-38 8-54-22-37z"/>
  <path d="M969 412l55-22 48 24 22 39-33 29-42-11-32 18-31-29z"/>
</g>
<!-- gold orbital accent -->
<ellipse cx="850" cy="390" rx="315" ry="92" fill="none" stroke="#a7772b" stroke-width="7" opacity=".8" transform="rotate(-16 850 390)"/>
<circle cx="1116" cy="303" r="11" fill="#a7772b"/>
<!-- arm behind -->
<path d="M1395 760c-105-58-215-112-323-154-71-27-133-37-187-19-49 17-86 55-102 101-11 32-2 61 25 79 40 27 94 21 147 6l174-49c82-23 157 9 266 75z" fill="url(#skin)"/>
<!-- palm -->
<path d="M790 650c-31-25-62-57-89-91-29-36-46-74-35-98 10-22 35-29 57-18 29 15 57 55 82 84l45 53c12-31 27-71 43-105 13-29 31-43 50-39 20 4 30 22 27 46l-16 117c19-31 40-62 62-91 18-24 39-31 57-22 18 10 22 30 13 52l-58 132c31-27 64-57 94-81 21-17 43-18 57-4 15 15 13 37-5 57-47 54-94 101-143 136-46 34-96 48-145 35-51-13-78-55-99-91z" fill="url(#skin)"/>
<!-- fingers wrapped around globe -->
<path d="M666 480c-35-28-67-65-88-103-14-26-8-48 10-59 19-11 39-2 57 19l89 105-68 38z" fill="#d3a47f"/>
<path d="M714 446c-29-39-47-79-55-112-6-25 6-44 26-49 21-5 37 10 48 35l57 122-76 4z" fill="#d7aa85"/>
<path d="M770 424c-19-45-27-88-25-119 2-25 17-39 37-38 21 2 31 20 34 46l13 117-59-6z" fill="#dcb08d"/>
<!-- globe base highlight -->
<circle cx="850" cy="390" r="270" fill="none" stroke="#ffffff" stroke-opacity=".48" stroke-width="5"/>
<path d="M665 205c58-62 142-94 226-82" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" opacity=".3"/>
<!-- subtle finance lines -->
<g fill="none" stroke="#122333" opacity=".12" stroke-width="3"><path d="M80 850h440"/><path d="M80 885h300"/><path d="M80 920h190"/></g>
</svg>