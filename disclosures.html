<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disclosures | Tilak Ventures Limited</title><link rel="stylesheet" href="styles.css"><style>.archive{padding:80px 0}.filters{display:flex;gap:10px;margin:25px 0}.filters input,.filters select{padding:12px;border:1px solid #ddd;border-radius:7px;font:inherit}.filters input{flex:1}.row{display:grid;grid-template-columns:130px 1fr 170px;gap:20px;padding:20px 0;border-bottom:1px solid #e4e7ea}.date,.meta{font-size:12px;color:#69727c}.doc{font-weight:700;font-size:12px}.empty{padding:40px 0;color:#69727c}@media(max-width:700px){.row{grid-template-columns:1fr}.filters{flex-direction:column}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html"><span class="mark">TV</span><span><b>TILAK VENTURES</b><small>LIMITED</small></span></a><nav><a href="index.html#company">Company</a><a href="index.html#investors">Investors</a><a href="index.html#governance">Governance</a><a href="index.html#contact">Contact</a></nav><a class="cta" href="index.html#investors">Investor Relations</a></div></header><main class="archive"><div class="wrap"><p class="kicker">INVESTOR RELATIONS</p><h1 id="heading">Disclosure archive</h1><p class="intro">Financial information, corporate announcements and shareholder disclosures.</p><div class="filters"><input id="search" placeholder="Search disclosures..."><select id="category"><option value="">All categories</option><option>Financial Results</option><option>Annual Reports</option><option>Corporate Announcements</option><option>Shareholding Pattern</option><option>AGM / EGM</option><option>Investor Presentations</option><option>Corporate Governance</option><option>Policies</option></select></div><div id="list"></div></div></main><script>const data=[];const p=new URLSearchParams(location.search);const initial=p.get('category')||'';document.getElementById('category').value=initial;const s=document.getElementById('search'),c=document.getElementById('category'),l=document.getElementById('list');function render(){const q=s.value.toLowerCase(),cat=c.value;const rows=data.filter(x=>(!cat||x.category===cat)&&(!q||(x.title+x.category).toLowerCase().includes(q)));l.innerHTML=rows.length?rows.map(x=>`<div class="row"><div class="date">${x.date}</div><div><b>${x.title}</b><div class="meta">${x.category}</div></div><a class="doc" href="${x.file}">View document →</a></div>`).join(''):'<div class="empty">No disclosures have been published in this archive yet. The production CMS will populate this page automatically when authorised company users publish documents.</div>'}s.oninput=render;c.onchange=render;render();</script></body></html>
